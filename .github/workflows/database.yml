# Applies every new SQL file in supabase/migrations to the Supabase project, then
# runs the tenant-isolation test. Secrets live in GitHub, never in the repo.
#   secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD
#   variables: SUPABASE_PROJECT_REF, SUPABASE_ANON_KEY (public by design)
name: Database

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/database.yml"]
  workflow_dispatch:

concurrency: database

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
      - run: supabase db push
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Tenant isolation test
        run: node supabase/tests/isolation.mjs
        env:
          SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
